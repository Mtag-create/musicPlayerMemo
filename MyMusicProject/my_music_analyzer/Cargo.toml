[package]
name = "my_music_analyzer"
version = "0.1.0"
edition = "2024"

[lib]
name = "my_music_analyzer"
path = "src/lib.rs"

[[bin]]
name = "my_music_analyzer"
path = "src/main.rs"

[[bin]]
name = "decode"
path = "src/bin/decode.rs"

[dependencies]
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
flate2 = "1"
rayon = "1"
mmz_format = { path = "../../mmz_format" }